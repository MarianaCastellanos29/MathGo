server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Angular es una SPA: si el archivo no existe, se entrega index.html
    # y el router de Angular decide que pantalla mostrar (/home, /padre, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
