<div class="mg-page">
  <app-scene></app-scene>

  <main class="mg-main contenedor">
    <app-selector-idioma class="esquina"></app-selector-idioma>
    <div class="saludo">
      <app-pyro class="pyro" [mood]="seleccionado ? 'happy' : 'idle'"></app-pyro>
      <div class="burbuja">{{ (seleccionado ? 'grado.bien' : 'grado.hola') | t }}</div>
    </div>

    <h1>{{ 'grado.titulo' | t }}</h1>
    <p class="sub">{{ 'grado.sub' | t }}</p>

    <div class="grados">
      <button
        *ngFor="let g of grados; let i = index"
        type="button"
        class="tarjeta-grado"
        [class.activo]="seleccionado === g.valor"
        [style.animation-delay.ms]="i * 90"
        (click)="elegir(g.valor)"
        [attr.aria-pressed]="seleccionado === g.valor">
        <span class="check" *ngIf="seleccionado === g.valor">✓</span>
        <span class="emoji">{{ g.emoji }}</span>
        <span class="numero">{{ g.valor }}°</span>
        <span class="nombre">{{ ('grado.nombre.' + g.valor) | t }}</span>
      </button>
    </div>

    <div class="vista-previa" *ngIf="seleccionado">
      <span class="etiqueta">{{ 'grado.practicaras' | t }}</span>
      <div class="temas">
        <span class="tema" *ngFor="let tema of temas">{{ tema | t }}</span>
      </div>
    </div>

    <p class="error" *ngIf="error">⚠️ {{ error | t }}</p>

    <button
      type="button"
      class="mg-btn btn-continuar"
      [disabled]="seleccionado === null || guardando"
      (click)="continuar()">
      {{ (guardando ? 'grado.guardando' : 'grado.vamos') | t }}
    </button>
  </main>
</div>
