<div class="home-container">

  <div class="particles-bg">
    <span *ngFor="let p of particulas" class="particle-bg"
          [style.left.%]="p.x"
          [style.animationDelay]="p.delay"
          [style.animationDuration]="p.duration"
          [style.fontSize]="p.size">{{ p.emoji }}</span>
  </div>

  <header class="home-header">
    <div class="logo-small">🎮 MathGo</div>
    <div class="user-info">
      <span class="monedas-header">🪙 {{ xp }}</span>
      <span class="vidas">{{ corazones }}</span>
      <button class="avatar-btn" (click)="irPerfil()" title="Cambiar avatar" aria-label="Cambiar avatar">
        <img [src]="avatarUrl" class="avatar" [alt]="nombre" />
      </button>
      <span class="nombre">{{ nombre }}</span>
      <button class="btn-logout" (click)="logout()">Salir</button>
    </div>
  </header>

  <main class="home-main">

    <div class="mascota-section">
      <div class="pyro-container">
        <div class="pyro-dragon">🐉</div>
        <div class="pyro-burbuja">¡Hola, {{ nombre }}! ¿Listo para practicar? 🔥</div>
        <div class="pyro-sombra"></div>
      </div>
    </div>

    <h2>🎮 Selecciona un nivel</h2>
    <p class="subtitle">Completa cada nivel para desbloquear el siguiente</p>

    <div class="niveles-grid">
      <button *ngFor="let nv of niveles; let i = index"
           class="nivel-card"
           [class.actual]="nv.id <= nivelActual"
           [class.bloqueado]="nv.id > nivelActual"
           [style.animationDelay]="(i * 0.12) + 's'"
           [style.--nivel-color]="nv.color"
           (click)="seleccionarNivel(nv.id)"
           [attr.aria-label]="nv.nombre + ' - ' + nv.descripcion">
        <div class="nivel-emoji-wrap">
          <span class="nivel-emoji">{{ nv.emoji }}</span>
          <div class="nivel-brillo" *ngIf="nv.id <= nivelActual"></div>
        </div>
        <h3>{{ nv.nombre }}</h3>
        <p>{{ nv.descripcion }}</p>
        <span class="nivel-badge"
              [class.badge-ok]="nv.id <= nivelActual"
              [class.badge-lock]="nv.id > nivelActual">
          {{ nv.id < nivelActual ? '✅ Completado' : nv.id === nivelActual ? '▶️ Jugar' : '🔒 Bloqueado' }}
        </span>
      </button>
    </div>

    <div class="accesos-rapidos">
      <a routerLink="/progreso" class="acceso-card progreso">
        <span class="acceso-icon">📊</span>
        <span class="acceso-label">Mi Progreso</span>
      </a>
      <a routerLink="/logros" class="acceso-card logros">
        <span class="acceso-icon">🏅</span>
        <span class="acceso-label">Mis Logros</span>
      </a>
      <a routerLink="/historial" class="acceso-card historial">
        <span class="acceso-icon">📋</span>
        <span class="acceso-label">Mi Historial</span>
      </a>
      <a routerLink="/tienda" class="acceso-card tienda">
        <span class="acceso-icon">🏪</span>
        <span class="acceso-label">Tienda</span>
      </a>
      <a routerLink="/padre" class="acceso-card padre" *ngIf="rol === 'PADRE'">
        <span class="acceso-icon">👨‍👩‍👧</span>
        <span class="acceso-label">Panel Padre</span>
      </a>
    </div>

  </main>
</div>
