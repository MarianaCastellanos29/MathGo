<div class="auth-container">
  <app-selector-idioma [flotante]="true"></app-selector-idioma>

  <div class="auth-left">
    <div class="auth-left-logo">
      <span class="logo-emoji">🎮</span>
      <span class="logo-name">MathGo</span>
    </div>
    <div class="auth-left-title"><span [innerHTML]="'LOGIN.SALUDO' | translate"></span> 👦</div>
    <p class="auth-left-sub" [innerHTML]="'LOGIN.SUBTITULO' | translate"></p>
    <button class="auth-left-btn" routerLink="/registro">← {{ 'LOGIN.IR_A_REGISTRO' | translate }}</button>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <h2 class="auth-title">{{ 'LOGIN.TITULO' | translate }}</h2>

      <div *ngIf="error" class="alert alert-error">{{ error | translate }}</div>

      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="form-group">
          <label for="correo">📧 {{ 'COMUN.CORREO' | translate }}</label>
          <input id="correo" type="email" [(ngModel)]="correo" name="correo"
                 [placeholder]="'COMUN.PLACEHOLDER_CORREO' | translate" required />
        </div>

        <div class="form-group">
          <label for="password">🔒 {{ 'COMUN.CONTRASENA' | translate }}</label>
          <input id="password" type="password" [(ngModel)]="password" name="password"
                 placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-primary" [disabled]="cargando">
          {{ (cargando ? 'LOGIN.ENTRANDO' : 'LOGIN.ENTRAR') | translate }}
        </button>
      </form>

      <p class="link-text">
        {{ 'LOGIN.SIN_CUENTA' | translate }} <a routerLink="/registro">{{ 'LOGIN.REGISTRATE_AQUI' | translate }}</a>
      </p>
    </div>
  </div>
</div>

<!-- Modal mensaje del padre -->
<div class="mensaje-overlay" *ngIf="mostrarMensaje" (click)="cerrarMensaje()">
  <div class="mensaje-modal" (click)="$event.stopPropagation()">
    <div class="mensaje-dragon">🐉</div>
    <div class="mensaje-badge">💌 {{ 'LOGIN.MENSAJE_FAMILIA' | translate }}</div>
    <h2>{{ 'LOGIN.TIENES_MENSAJE' | translate }}</h2>
    <div class="mensaje-texto">{{ mensajePadre }}</div>
    <button class="btn-mensaje-ok" (click)="cerrarMensaje()">
      {{ 'LOGIN.GRACIAS' | translate }} ➡️ {{ 'LOGIN.IR_A_JUGAR' | translate }}
    </button>
  </div>
</div>
