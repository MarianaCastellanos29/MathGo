<div class="auth-container">
  <div class="auth-left">
    <div class="auth-left-logo">
      <span class="logo-emoji">🎮</span>
      <span class="logo-name">MathGo</span>
    </div>
    <div class="auth-left-title">¡Hola de<br>nuevo! 👦</div>
    <p class="auth-left-sub">Continúa tu aventura<br>matemática</p>
    <button class="auth-left-btn" routerLink="/registro">← Crear cuenta</button>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <h2 class="auth-title">Iniciar sesión</h2>

      <div *ngIf="error" class="alert alert-error">{{ error }}</div>

      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="form-group">
          <label for="correo">📧 Correo electrónico</label>
          <input id="correo" type="email" [(ngModel)]="correo" name="correo"
                 placeholder="tu@correo.com" required />
        </div>

        <div class="form-group">
          <label for="password">🔒 Contraseña</label>
          <input id="password" type="password" [(ngModel)]="password" name="password"
                 placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-primary" [disabled]="cargando">
          {{ cargando ? 'Entrando...' : '¡Entrar!' }}
        </button>
      </form>

      <p class="link-text">
        ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
      </p>
    </div>
  </div>
</div>

<!-- Modal mensaje del padre -->
<div class="mensaje-overlay" *ngIf="mostrarMensaje" (click)="cerrarMensaje()">
  <div class="mensaje-modal" (click)="$event.stopPropagation()">
    <div class="mensaje-dragon">🐉</div>
    <div class="mensaje-badge">💌 Mensaje de tu familia</div>
    <h2>¡Tienes un mensaje!</h2>
    <div class="mensaje-texto">{{ mensajePadre }}</div>
    <button class="btn-mensaje-ok" (click)="cerrarMensaje()">
      ¡Gracias! ➡️ Ir a jugar
    </button>
  </div>
</div>
