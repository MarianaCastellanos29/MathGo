<div class="mg-page">
  <app-scene></app-scene>
  <app-nav></app-nav>
  <main class="mg-main perfil">
    <div class="mg-title">
      <h1>🎨 {{ 'PERFIL.TITULO' | translate }}</h1>
      <p>{{ 'PERFIL.SUBTITULO' | translate }}</p>
    </div>

    <div class="mg-card actual">
      <img [src]="getAvatarUrl(avatarSeleccionado)" [alt]="nombre" class="grande" />
      <div>
        <h2>{{ nombre }}</h2>
        <p>{{ 'PERFIL.MAS_AVATARES' | translate }} <a routerLink="/tienda">🏪 {{ 'NAV.TIENDA' | translate }}</a></p>
      </div>
    </div>

    <div class="avatares">
      <div *ngFor="let estilo of estilos" class="mg-card opcion"
           [class.seleccionado]="avatarSeleccionado === estilo.id"
           [class.bloqueado]="!estaComprado(estilo.id)"
           (click)="seleccionar(estilo.id)">
        <div class="wrap">
          <img [src]="getAvatarUrl(estilo.id)" [alt]="('AVATARES.' + estilo.id + '.NOMBRE') | translate" [class.blur]="!estaComprado(estilo.id)" />
          <span class="lock" *ngIf="!estaComprado(estilo.id)">🔒</span>
        </div>
        <strong>{{ ('AVATARES.' + estilo.id + '.NOMBRE') | translate }}</strong>
        <small *ngIf="!estaComprado(estilo.id)">{{ 'PERFIL.VER_TIENDA' | translate }}</small>
      </div>
    </div>

    <div class="guardar"><button class="mg-btn" (click)="guardar()">{{ guardado ? '✅ ' + ('PERFIL.GUARDADO' | translate) : '💾 ' + ('PERFIL.GUARDAR' | translate) }}</button></div>
  </main>
</div>
