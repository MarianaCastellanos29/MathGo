<div class="perfil-container">
  <div class="header">
    <a routerLink="/home" class="btn-back">← Volver</a>
    <h1>🎨 Mi Avatar</h1>
  </div>

  <div class="avatar-actual">
    <img [src]="getAvatarUrl(avatarSeleccionado)" [alt]="nombre" class="avatar-grande" />
    <p class="nombre-usuario">{{ nombre }}</p>
    <p class="hint">Compra más avatares en la <a routerLink="/tienda">🏪 Tienda</a></p>
  </div>

  <div class="avatares-grid">
    <div *ngFor="let estilo of estilos"
         class="avatar-opcion"
         [class.seleccionado]="avatarSeleccionado === estilo.id"
         [class.bloqueado]="!estaComprado(estilo.id)"
         (click)="seleccionar(estilo.id)">
      <div class="avatar-wrap">
        <img [src]="getAvatarUrl(estilo.id)" [alt]="estilo.nombre"
             [class.blur]="!estaComprado(estilo.id)" />
        <div class="lock-overlay" *ngIf="!estaComprado(estilo.id)">
          🔒
        </div>
      </div>
      <span>{{ estilo.nombre }}</span>
      <span class="precio-hint" *ngIf="!estaComprado(estilo.id)">Ver tienda</span>
    </div>
  </div>

  <button class="btn-guardar" (click)="guardar()">
    {{ guardado ? '✅ ¡Guardado!' : '💾 Guardar avatar' }}
  </button>
</div>
