<div class="auth-container">
  <app-selector-idioma [flotante]="true"></app-selector-idioma>

  <div class="auth-left">
    <div class="auth-left-logo">
      <span class="logo-emoji">🎮</span>
      <span class="logo-name">MathGo</span>
    </div>
    <div class="auth-left-title"><span [innerHTML]="'REGISTRO.SALUDO' | translate"></span> 👦</div>
    <p class="auth-left-sub" [innerHTML]="'REGISTRO.SUBTITULO' | translate"></p>
    <button class="auth-left-btn" routerLink="/login">{{ 'REGISTRO.YA_TENGO_CUENTA' | translate }} →</button>
  </div>
  <div class="auth-right">
    <div class="auth-card">
      <h2 class="auth-title">{{ 'REGISTRO.TITULO' | translate }}</h2>

      <div *ngIf="error" class="alert alert-error">{{ error | translate }}</div>
      <div *ngIf="exito" class="alert alert-success">{{ exito | translate }}</div>

      <form (ngSubmit)="registrar()" #regForm="ngForm">
        <div class="form-group">
          <label for="nombre">👤 {{ 'REGISTRO.NOMBRE' | translate }}</label>
          <input id="nombre" type="text" [(ngModel)]="nombre" name="nombre"
                 [placeholder]="'REGISTRO.PLACEHOLDER_NOMBRE' | translate" required />
        </div>

        <div class="form-group">
          <label for="correo">📧 {{ 'COMUN.CORREO' | translate }}</label>
          <input id="correo" type="email" [(ngModel)]="correo" name="correo"
                 [placeholder]="'COMUN.PLACEHOLDER_CORREO' | translate" required />
        </div>

        <div class="form-group">
          <label for="password">🔒 {{ 'COMUN.CONTRASENA' | translate }}</label>
          <input id="password" type="password" [(ngModel)]="password" name="password"
                 [placeholder]="'REGISTRO.PLACEHOLDER_PASSWORD' | translate" required />
        </div>

        <div class="form-group">
          <label for="rol">🎭 {{ 'REGISTRO.SOY' | translate }}</label>
          <select id="rol" [(ngModel)]="rol" name="rol">
            <option value="ALUMNO">👦 {{ 'REGISTRO.ROL_ALUMNO' | translate }}</option>
            <option value="PADRE">👨 {{ 'REGISTRO.ROL_PADRE' | translate }}</option>
          </select>
        </div>

        <button type="submit" class="btn-primary" [class.btn-padre]="rol === 'PADRE'" [disabled]="cargando">
          {{ (cargando ? 'REGISTRO.CREANDO' : 'REGISTRO.CREAR') | translate }}
        </button>
      </form>

      <p class="link-text">
        {{ 'REGISTRO.YA_TIENES_CUENTA' | translate }} <a routerLink="/login">{{ 'REGISTRO.INICIA_SESION' | translate }}</a>
      </p>
    </div>
  </div>
</div>
