<div class="mg-page">
  <app-scene></app-scene>
  <app-nav></app-nav>

  <main class="mg-main juegos-home">
    <div class="mg-title">
      <h1>{{ 'juegos.titulo' | t }}</h1>
      <p>{{ 'juegos.sub' | t:{ nombre: nombre } }}</p>
    </div>

    <div class="juegos-grid">
      <a *ngFor="let j of juegos" [routerLink]="j.ruta" class="mg-card juego-card">
        <img [src]="j.img" [alt]="j.nombre | t" class="juego-img" />
        <h2>{{ j.nombre | t }}</h2>
        <p>{{ j.descripcion | t }}</p>
        <span class="mg-btn">{{ 'juegos.jugar' | t }}</span>
      </a>
    </div>
  </main>
</div>
