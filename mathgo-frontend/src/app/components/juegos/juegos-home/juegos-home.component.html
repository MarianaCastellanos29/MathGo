<div class="mg-page">
  <app-scene></app-scene>
  <app-nav></app-nav>

  <main class="mg-main juegos-home">
    <div class="mg-title">
      <h1>🎲 Zona de juegos</h1>
      <p>Elige un juego, {{ nombre }}, y pon a prueba lo que has aprendido</p>
    </div>

    <div class="juegos-grid">
      <a *ngFor="let j of juegos" [routerLink]="j.ruta" class="mg-card juego-card">
        <img [src]="j.img" [alt]="j.nombre" class="juego-img" />
        <h2>{{ j.nombre }}</h2>
        <p>{{ j.descripcion }}</p>
        <span class="mg-btn">▶ Jugar</span>
      </a>
    </div>
  </main>
</div>
